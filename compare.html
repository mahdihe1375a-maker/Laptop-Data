<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compare Laptops | LAPTOP DATA</title><link rel="stylesheet" href="./style.css"></head><body><header class="header"><nav class="nav"><a href="./index.html" class="logo">LAPTOP <span>DATA</span></a><div class="nav-links"><a href="./index.html">Home</a><a href="./laptops.html">All Laptops</a></div></nav></header><main class="container"><h1 style="font-size:32px;font-weight:800;margin-bottom:8px;">Laptop Comparison</h1><p class="text-muted mb-4">Select configurations to compare side-by-side.</p><div id="compareContainer" style="overflow-x:auto;"></div></main><script src="./data.js"></script><script src="./app.js"></script><script>const params=getParams(),id1=params.get('id1'),id2=params.get('id2'),l1=AppState.laptops.find(l=>l.id===id1),l2=AppState.laptops.find(l=>l.id===id2);if(!l1||!l2){document.getElementById('compareContainer').innerHTML=`<div style="padding:40px;text-align:center;"><p>Please select two laptops to compare.</p><a href="./laptops.html" class="btn btn-primary mt-4">Browse Laptops</a></div>`}else{const v1=l1.variants[0],v2=l2.variants[0],specs=[{label:'Price',val1:formatPrice(l1.price),val2:formatPrice(l2.price),lowerIsBetter:true},{label:'Processor',val1:v1.cpu,val2:v2.cpu},{label:'Graphics',val1:v1.gpu,val2:v2.gpu},{label:'RAM',val1:v1.ram,val2:v2.ram},{label:'Storage',val1:v1.storage,val2:v2.storage},{label:'Display',val1:`${v1.displaySize} ${v1.resolution} ${v1.refreshRate}`,val2:`${v2.displaySize} ${v2.resolution} ${v2.refreshRate}`},{label:'Battery Life',val1:v1.batteryLife,val2:v2.batteryLife,lowerIsBetter:false},{label:'Weight',val1:v1.weight,val2:v2.weight,lowerIsBetter:true},{label:'Overall Score',val1:l1.scores.overall,val2:l2.scores.overall,isScore:true}];let html=`<table class="compare-table"><thead><tr><th>Specification</th><th style="min-width:250px;"><img src="${l1.image}" style="width:120px;height:90px;object-fit:contain;margin-bottom:8px;" onerror="this.style.display='none'"><div style="font-weight:700;">${l1.brand} ${l1.model}</div><a href="./laptop.html?id=${l1.id}" class="btn btn-ghost" style="padding:4px 8px;font-size:12px;">View Details</a></th><th style="min-width:250px;"><img src="${l2.image}" style="width:120px;height:90px;object-fit:contain;margin-bottom:8px;" onerror="this.style.display='none'"><div style="font-weight:700;">${l2.brand} ${l2.model}</div><a href="./laptop.html?id=${l2.id}" class="btn btn-ghost" style="padding:4px 8px;font-size:12px;">View Details</a></th></tr></thead><tbody>`;specs.forEach(spec=>{let class1='',class2='';if(spec.isScore){if(spec.val1>spec.val2)class1='winner winner-bg';else if(spec.val2>spec.val1)class2='winner winner-bg'}else if(spec.lowerIsBetter){if(String(spec.val1).toLowerCase()<String(spec.val2).toLowerCase())class1='winner';else if(String(spec.val2).toLowerCase()<String(spec.val1).toLowerCase())class2='winner'}html+=`<tr><td>${spec.label}</td><td class="${class1}">${spec.val1} ${class1?'✓':''}</td><td class="${class2}">${spec.val2} ${class2?'✓':''}</td></tr>`});html+=`</tbody></table>`;html+=`<div style="margin-top:32px;padding:24px;background:var(--bg-secondary);border-radius:var(--radius);"><h3 style="margin-bottom:12px;">Summary</h3><p class="text-muted">The <strong>${l1.scores.overall>l2.scores.overall?l1.model:l2.model}</strong> offers a better overall specification score. However, the <strong>${l1.scores.value>l2.scores.value?l1.model:l2.model}</strong> provides better value for money. Choose based on your priority: raw performance or portability/battery life.</p></div>`;document.getElementById('compareContainer').innerHTML=html}</script></body></html>
