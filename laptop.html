<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Laptop Details | LAPTOP DATA</title><meta name="description" content="Detailed specifications and performance scores."><link rel="stylesheet" href="./style.css"></head><body><header class="header"><nav class="nav"><a href="./index.html" class="logo">LAPTOP <span>DATA</span></a><div class="nav-links"><a href="./index.html">Home</a><a href="./laptops.html">All Laptops</a><button class="btn btn-ghost" id="themeToggle">🌓</button></div></nav></header><main class="container" id="detailContainer"></main><script src="./data.js"></script><script src="./app.js"></script><script>const params=getParams(),laptopId=params.get('id'),laptop=AppState.laptops.find(l=>l.id===laptopId);if(!laptop){document.getElementById('detailContainer').innerHTML=`<div style="text-align:center;padding:80px 20px;"><h2>Laptop not found</h2><a href="./laptops.html" class="btn btn-primary mt-4">Back to Database</a></div>`}else{ensureScores(laptop);updateSEO(laptop);let currentVariantIdx=0;function render(){const v=laptop.variants[currentVariantIdx];document.getElementById('detailContainer').innerHTML=`<div style="margin-bottom:24px;"><a href="./laptops.html" style="color:var(--primary);text-decoration:none;font-size:14px;">← Back to all laptops</a></div><div class="detail-header"><div class="detail-image"><img src="${laptop.image}" alt="${laptop.brand} ${laptop.model}" onerror="this.src='https://via.placeholder.com/600x400?text=Laptop'"></div><div class="detail-info"><div class="card-brand">${laptop.brand} • ${laptop.series}</div><h1>${laptop.model}</h1><div class="detail-meta">Released: ${laptop.releaseYear} • Source: ${laptop.source}</div><div style="display:flex;gap:16px;margin:24px 0;"><div style="text-align:center;padding:16px;background:var(--bg-secondary);border-radius:var(--radius);flex:1;"><div style="font-size:32px;font-weight:800;color:var(--success);">${laptop.scores.overall}</div><div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;">Overall Score</div></div><div style="text-align:center;padding:16px;background:var(--bg-secondary);border-radius:var(--radius);flex:1;"><div style="font-size:32px;font-weight:800;color:var(--primary);">${laptop.scores.value}</div><div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;">Value Score</div></div></div>${laptop.variants.length>1?`<div class="variant-selector"><div class="filter-label">Select Configuration</div>${laptop.variants.map((variant,idx)=>`<div class="variant-option ${idx===currentVariantIdx?'active':''}" onclick="changeVariant(${idx})"><div><div style="font-weight:700;">${variant.cpu} / ${variant.gpu}</div><div style="font-size:13px;color:var(--text-muted);">${variant.ram} • ${variant.storage} • ${variant.displaySize} ${variant.refreshRate}</div></div><div style="font-weight:800;color:var(--primary);">${formatPrice(laptop.price+(idx*200))}</div></div>`).join('')}</div>`:''}<div style="display:flex;gap:12px;margin-top:24px;"><a href="./compare.html?id1=${laptop.id}" class="btn btn-primary" style="flex:1;justify-content:center;">Add to Compare</a><button class="btn btn-secondary" onclick="AppState.toggleFavorite('${laptop.id}');this.textContent=AppState.favorites.includes('${laptop.id}')?'Saved ❤️':'Save 🤍'">${AppState.favorites.includes(laptop.id)?'Saved ❤️':'Save 🤍'}</button></div></div></div><h2 style="font-size:24px;font-weight:700;margin-bottom:24px;">Technical Specifications</h2><div class="specs-grid"><div class="spec-card"><h3>Processor</h3><div class="spec-row"><span>Model</span><span>${v.cpu}</span></div><div class="spec-row"><span>Brand</span><span>${v.cpuBrand}</span></div></div><div class="spec-card"><h3>Graphics</h3><div class="spec-row"><span>Model</span><span>${v.gpu}</span></div><div class="spec-row"><span>Brand</span><span>${v.gpuBrand}</span></div></div><div class="spec-card"><h3>Memory & Storage</h3><div class="spec-row"><span>RAM</span><span>${v.ram} ${v.ramType}</span></div><div class="spec-row"><span>Storage</span><span>${v.storage}</span></div></div><div class="spec-card"><h3>Display</h3><div class="spec-row"><span>Size</span><span>${v.displaySize}</span></div><div class="spec-row"><span>Resolution</span><span>${v.resolution}</span></div><div class="spec-row"><span>Panel</span><span>${v.panelType} ${v.refreshRate}</span></div></div><div class="spec-card"><h3>Battery & Weight</h3><div class="spec-row"><span>Capacity</span><span>${v.battery}</span></div><div class="spec-row"><span>Est. Life</span><span>${v.batteryLife}</span></div><div class="spec-row"><span>Weight</span><span>${v.weight}</span></div></div><div class="spec-card"><h3>Connectivity</h3><div class="spec-row"><span>Ports</span><span style="text-align:right;max-width:60%;">${laptop.ports||'Not specified'}</span></div><div class="spec-row"><span>OS</span><span>${v.os}</span></div></div></div><div style="margin-top:48px;background:var(--bg-secondary);padding:32px;border-radius:var(--radius);"><h3 style="margin-bottom:16px;">Use Case Suitability (Estimated)</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">${Object.entries(laptop.useCases).map(([key,val])=>`<div><div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px;"><span style="text-transform:capitalize;">${key}</span><span style="font-weight:700;">${val}/100</span></div><div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${val}%;background:${val>80?'var(--success)':val>60?'var(--warning)':'var(--danger)'};"></div></div></div>`).join('')}</div><p style="font-size:12px;color:var(--text-muted);margin-top:16px;">* Scores are estimated based on hardware specifications for general guidance.</p></div>`}window.changeVariant=idx=>{currentVariantIdx=idx;render()};render()}</script></body></html>
