<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | LAPTOP DATA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <div style="font-size: 40px; margin-bottom: 10px;">🔐</div>
      <h2>Admin Access</h2>
      <p>Enter your password to continue</p>
      <div class="login-error" id="loginError">Incorrect password</div>
      <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') login()">
      <button class="btn btn-primary" onclick="login()">Sign In</button>
      <p style="margin-top: 20px; font-size: 12px; color: var(--text-tertiary);">
        Default password: <strong>admin123</strong>
      </p>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" style="display: none;">
    <header class="header">
      <nav class="nav">
        <a href="index.html" class="logo">
          <img src="logo.png" alt="LAPTOP DATA" class="logo-img" onerror="this.style.display='none'">
          <span class="logo-text">LAPTOP DATA</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary">
            ← Back to Site
          </a>
          <button class="btn btn-outline" onclick="logout()">
            Logout
          </button>
        </div>
      </nav>
    </header>

    <div class="admin-container">
      <div class="admin-header">
        <h1>Manage Laptops</h1>
        <div class="admin-actions">
          <button class="btn btn-primary" onclick="openAddForm()">
            + Add New Laptop
          </button>
          <button class="btn btn-secondary" onclick="exportData()">
            ↓ Export JSON
          </button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
            ↑ Import JSON
          </button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
          <button class="btn btn-outline" onclick="resetData()">
            ↻ Reset
          </button>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Brand</th>
              <th>Variants</th>
              <th>Price Range</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal form-modal">
      <button class="modal-close" onclick="closeForm()"></button>
      <div style="padding: 30px 40px 10px;">
        <h2 id="formTitle" style="font-size: 24px; font-weight: 700;">Add New Laptop</h2>
      </div>
      <form id="laptopForm" onsubmit="saveLaptop(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label>Laptop Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Brand *</label>
            <input type="text" name="brand" required placeholder="Apple, Dell, HP...">
          </div>
          <div class="form-group">
            <label>Display Size *</label>
            <input type="text" name="displaySize" required placeholder="15.6 inch">
          </div>
          <div class="form-group full">
            <label>Image *</label>
            <div class="image-upload" onclick="document.getElementById('imageUpload').click()">
              <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
              <div>
                <div style="font-size: 28px; margin-bottom: 6px;">📤</div>
                <div style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">Click to upload image</div>
                <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 4px;">PNG, JPG up to 2MB</div>
              </div>
              <img id="imagePreview" class="image-preview" style="display: none;">
            </div>
            <input type="url" name="image" id="imageUrl" placeholder="Or paste image URL here" style="margin-top: 10px;">
          </div>
          <div class="form-group">
            <label>Display Type *</label>
            <input type="text" name="displayType" required placeholder="IPS, OLED, Retina...">
          </div>
          <div class="form-group">
            <label>Resolution *</label>
            <input type="text" name="resolution" required placeholder="1920 x 1080">
          </div>
          <div class="form-group">
            <label>Battery *</label>
            <input type="text" name="battery" required placeholder="10 hours">
          </div>
          <div class="form-group">
            <label>Weight *</label>
            <input type="text" name="weight" required placeholder="1.8 kg">
          </div>
          <div class="form-group">
            <label>Operating System *</label>
            <input type="text" name="os" required placeholder="Windows 11">
          </div>
          <div class="form-group full">
            <label>Ports *</label>
            <input type="text" name="ports" required placeholder="2x USB-C, HDMI...">
          </div>
          <div class="form-group full">
            <label>Description</label>
            <textarea name="description" placeholder="Brief description about the laptop..."></textarea>
          </div>
          
          <!-- Variants Editor -->
          <div class="form-group full">
            <label>Configurations (Variants) *</label>
            <div class="variants-editor">
              <div class="variant-header">
                <div>CPU</div>
                <div>Type</div>
                <div>GPU</div>
                <div>RAM</div>
                <div>Storage</div>
                <div>Price</div>
              </div>
              <div id="variantsContainer"></div>
              <button type="button" class="btn-add-variant" onclick="addVariantRow()">+ Add Configuration</button>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeForm()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Laptop</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    // ===== Security: SHA-256 Hash of "admin123" =====
    // The actual password is never stored in the code
    const ADMIN_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
    const SESSION_KEY = 'admin_logged_in';

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== Init =====
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        showAdmin();
      }
    });

    async function login() {
      const pass = document.getElementById('passwordInput').value;
      const hash = await hashPassword(pass);
      if (hash === ADMIN_HASH) {
        sessionStorage.setItem(SESSION_KEY, 'true');
        showAdmin();
      } else {
        document.getElementById('loginError').classList.add('show');
        document.getElementById('passwordInput').value = '';
      }
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    function showAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      renderAdminTable();
    }

    // ===== Image Upload =====
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      if (file.size > 2 * 1024 * 1024) {
        showToast('Image size must be less than 2MB', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('imageUrl').value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ===== Variants Editor =====
    let variantRows = [];

    function addVariantRow(data = null) {
      const container = document.getElementById('variantsContainer');
      const idx = variantRows.length;
      
      const row = document.createElement('div');
      row.className = 'variant-row';
      row.dataset.idx = idx;
      row.innerHTML = `
        <input type="text" name="v_cpu" placeholder="CPU" value="${data?.cpu || ''}" required>
        <select name="v_cpuType" required>
          <option value="Intel" ${data?.cpuType === 'Intel' ? 'selected' : ''}>Intel</option>
          <option value="AMD" ${data?.cpuType === 'AMD' ? 'selected' : ''}>AMD</option>
          <option value="Apple Silicon" ${data?.cpuType === 'Apple Silicon' ? 'selected' : ''}>Apple</option>
        </select>
        <input type="text" name="v_gpu" placeholder="GPU" value="${data?.gpu || ''}" required>
        <input type="text" name="v_ram" placeholder="RAM" value="${data?.ram || ''}" required>
        <input type="text" name="v_storage" placeholder="Storage" value="${data?.storage || ''}" required>
        <div style="display: flex; gap: 6px;">
          <input type="number" name="v_price" placeholder="Price" value="${data?.price || ''}" required min="0" style="flex: 1;">
          <button type="button" class="btn-remove-variant" onclick="removeVariantRow(${idx})">✕</button>
        </div>
      `;
      
      container.appendChild(row);
      variantRows.push(row);
    }

    function removeVariantRow(idx) {
      const row = variantRows[idx];
      if (row) {
        row.remove();
        variantRows[idx] = null;
      }
    }

    function getVariantsFromForm() {
      const variants = [];
      variantRows.forEach(row => {
        if (!row) return;
        const cpu = row.querySelector('[name="v_cpu"]').value.trim();
        const cpuType = row.querySelector('[name="v_cpuType"]').value;
        const gpu = row.querySelector('[name="v_gpu"]').value.trim();
        const ram = row.querySelector('[name="v_ram"]').value.trim();
        const storage = row.querySelector('[name="v_storage"]').value.trim();
        const price = parseFloat(row.querySelector('[name="v_price"]').value);
        
        if (cpu && gpu && ram && storage && !isNaN(price)) {
          variants.push({ cpu, cpuType, gpu, ram, storage, price });
        }
      });
      return variants;
    }

    // ===== Admin Table =====
    function renderAdminTable() {
      const laptops = loadLaptops();
      const tbody = document.getElementById('adminTableBody');
      
      if (laptops.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">
              No laptops added yet. Add your first laptop!
            </td>
          </tr>
        `;
        return;
      }
      
      tbody.innerHTML = laptops.map(l => {
        const minPrice = Math.min(...l.variants.map(v => v.price));
        const maxPrice = Math.max(...l.variants.map(v => v.price));
        const priceRange = minPrice === maxPrice 
          ? `$${minPrice.toLocaleString()}` 
          : `$${minPrice.toLocaleString()} - $${maxPrice.toLocaleString()}`;
        
        return `
          <tr>
            <td><img src="${l.image}" onerror="this.src='https://via.placeholder.com/60x45/f5f5f7/6e6e73?text=L'"></td>
            <td><strong>${l.name}</strong></td>
            <td>${l.brand}</td>
            <td>${l.variants.length}</td>
            <td>${priceRange}</td>
            <td>
              <div class="action-btns">
                <button class="btn-icon btn-edit" onclick="editLaptop(${l.id})" title="Edit">✎</button>
                <button class="btn-icon btn-delete" onclick="deleteLaptop(${l.id})" title="Delete">🗑</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // ===== Add / Edit =====
    let editingId = null;

    function openAddForm() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Add New Laptop';
      document.getElementById('laptopForm').reset();
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('variantsContainer').innerHTML = '';
      variantRows = [];
      addVariantRow(); // Add one empty row
      document.getElementById('formModal').classList.add('active');
    }

    function editLaptop(id) {
      const laptop = loadLaptops().find(l => l.id === id);
      if (!laptop) return;
      
      editingId = id;
      document.getElementById('formTitle').textContent = 'Edit Laptop';
      
      const form = document.getElementById('laptopForm');
      const fields = ['name', 'brand', 'image', 'displaySize', 'displayType', 'resolution', 'battery', 'weight', 'os', 'ports', 'description'];
      fields.forEach(key => {
        const input = form.querySelector(`[name="${key}"]`);
        if (input) input.value = laptop[key] || '';
      });
      
      // Show image preview
      if (laptop.image && laptop.image.startsWith('data:image')) {
        const preview = document.getElementById('imagePreview');
        preview.src = laptop.image;
        preview.style.display = 'block';
      }
      
      // Populate variants
      document.getElementById('variantsContainer').innerHTML = '';
      variantRows = [];
      laptop.variants.forEach(v => addVariantRow(v));
      
      document.getElementById('formModal').classList.add('active');
    }

    function closeForm() {
      document.getElementById('formModal').classList.remove('active');
      editingId = null;
    }

    function saveLaptop(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      
      const variants = getVariantsFromForm();
      if (variants.length === 0) {
        showToast('Add at least one configuration', 'error');
        return;
      }
      
      data.variants = variants;
      delete data.v_cpu;
      delete data.v_cpuType;
      delete data.v_gpu;
      delete data.v_ram;
      delete data.v_storage;
      delete data.v_price;
      
      const laptops = loadLaptops();
      
      if (editingId) {
        const idx = laptops.findIndex(l => l.id === editingId);
        laptops[idx] = { ...laptops[idx], ...data };
        showToast('Laptop updated successfully', 'success');
      } else {
        const newId = laptops.length > 0 ? Math.max(...laptops.map(l => l.id)) + 1 : 1;
        laptops.push({ id: newId, ...data });
        showToast('Laptop added successfully', 'success');
      }
      
      saveLaptops(laptops);
      closeForm();
      renderAdminTable();
    }

    function deleteLaptop(id) {
      if (!confirm('Are you sure you want to delete this laptop?')) return;
      
      let laptops = loadLaptops();
      laptops = laptops.filter(l => l.id !== id);
      saveLaptops(laptops);
      renderAdminTable();
      showToast('Laptop deleted', 'success');
    }

    // ===== Import / Export =====
    function exportData() {
      const laptops = loadLaptops();
      const blob = new Blob([JSON.stringify(laptops, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `laptops-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded', 'success');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = event => {
        try {
          const data = JSON.parse(event.target.result);
          if (!Array.isArray(data)) throw new Error('Invalid format');
          saveLaptops(data);
          renderAdminTable();
          showToast(`${data.length} laptops imported`, 'success');
        } catch (err) {
          showToast('Error reading file', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetData() {
      if (!confirm('Reset all data to default?')) return;
      localStorage.removeItem('laptops_data');
      renderAdminTable();
      showToast('Data reset', 'success');
    }

    // ===== Toast =====
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });
  </script>
</body>
  </html>
