<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | LAPTOP DATA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
      <h2>Admin Panel</h2>
      <p>Enter your password to access the admin panel</p>
      <div class="login-error" id="loginError">Incorrect password</div>
      <input type="password" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') login()">
      <button class="btn btn-primary" onclick="login()">Login</button>
      <p style="margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
        Default password: <strong>admin123</strong>
      </p>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" style="display: none;">
    <header class="header">
      <nav class="nav">
        <a href="index.html" class="logo">
          <img src="logo.png" alt="LAPTOP DATA" class="logo-img" onerror="this.style.display='none'">
          <span class="logo-text">LAPTOP DATA</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary">
            🏠 Back to Site
          </a>
          <button class="btn btn-outline" onclick="logout()">
            🚪 Logout
          </button>
        </div>
      </nav>
    </header>

    <div class="admin-container">
      <div class="admin-header">
        <h1>Manage Laptops</h1>
        <div class="admin-actions">
          <button class="btn btn-primary" onclick="openAddForm()">
            ➕ Add New Laptop
          </button>
          <button class="btn btn-secondary" onclick="exportData()">
            📥 Export JSON
          </button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
            📤 Import JSON
          </button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
          <button class="btn btn-outline" onclick="resetData()">
            🔄 Reset Data
          </button>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Brand</th>
              <th>Processor</th>
              <th>RAM</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal form-modal">
      <button class="modal-close" onclick="closeForm()">✕</button>
      <div style="padding: 32px 40px 16px;">
        <h2 id="formTitle" style="font-size: 28px; font-weight: 800; letter-spacing: -1px;">Add New Laptop</h2>
      </div>
      <form id="laptopForm" onsubmit="saveLaptop(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label>Laptop Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Brand *</label>
            <input type="text" name="brand" required placeholder="Apple, Dell, HP...">
          </div>
          <div class="form-group">
            <label>Price (USD) *</label>
            <input type="number" name="price" required min="0">
          </div>
          <div class="form-group full">
            <label>Image *</label>
            <div class="image-upload" onclick="document.getElementById('imageUpload').click()">
              <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
              <div class="image-upload-label">
                <div class="image-upload-icon">📤</div>
                <div class="image-upload-text">Click to upload image or drag and drop</div>
                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">PNG, JPG up to 2MB</div>
              </div>
              <img id="imagePreview" class="image-preview" style="display: none;">
            </div>
            <input type="url" name="image" id="imageUrl" placeholder="Or paste image URL here" style="margin-top: 12px;">
          </div>
          <div class="form-group">
            <label>Processor (CPU) *</label>
            <input type="text" name="cpu" required placeholder="Intel Core i7-13700H">
          </div>
          <div class="form-group">
            <label>Processor Type *</label>
            <select name="cpuType" required>
              <option value="Intel">Intel</option>
              <option value="AMD">AMD</option>
              <option value="Apple Silicon">Apple Silicon</option>
            </select>
          </div>
          <div class="form-group">
            <label>RAM *</label>
            <input type="text" name="ram" required placeholder="16 GB">
          </div>
          <div class="form-group">
            <label>Storage *</label>
            <input type="text" name="storage" required placeholder="512 GB SSD">
          </div>
          <div class="form-group">
            <label>Display Size *</label>
            <input type="text" name="displaySize" required placeholder="15.6 inch">
          </div>
          <div class="form-group">
            <label>Display Type *</label>
            <input type="text" name="displayType" required placeholder="IPS, OLED, Retina...">
          </div>
          <div class="form-group">
            <label>Resolution *</label>
            <input type="text" name="resolution" required placeholder="1920 x 1080">
          </div>
          <div class="form-group">
            <label>Graphics *</label>
            <input type="text" name="gpu" required placeholder="NVIDIA RTX 4060">
          </div>
          <div class="form-group">
            <label>Battery *</label>
            <input type="text" name="battery" required placeholder="10 hours">
          </div>
          <div class="form-group">
            <label>Weight *</label>
            <input type="text" name="weight" required placeholder="1.8 kg">
          </div>
          <div class="form-group">
            <label>Operating System *</label>
            <input type="text" name="os" required placeholder="Windows 11">
          </div>
          <div class="form-group full">
            <label>Ports *</label>
            <input type="text" name="ports" required placeholder="2x USB-C, HDMI...">
          </div>
          <div class="form-group full">
            <label>Description</label>
            <textarea name="description" placeholder="Brief description about the laptop..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeForm()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Laptop</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    // ===== Admin Password =====
    const ADMIN_PASSWORD = 'admin123';
    const SESSION_KEY = 'admin_logged_in';

    // ===== Init =====
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        showAdmin();
      }
    });

    function login() {
      const pass = document.getElementById('passwordInput').value;
      if (pass === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'true');
        showAdmin();
      } else {
        document.getElementById('loginError').classList.add('show');
        document.getElementById('passwordInput').value = '';
      }
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    function showAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      renderAdminTable();
    }

    // ===== Image Upload =====
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      if (file.size > 2 * 1024 * 1024) {
        showToast('Image size must be less than 2MB', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('imageUrl').value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ===== Admin Table =====
    function renderAdminTable() {
      const laptops = loadLaptops();
      const tbody = document.getElementById('adminTableBody');
      
      if (laptops.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 60px; color: var(--text-secondary);">
              No laptops added yet. Add your first laptop!
            </td>
          </tr>
        `;
        return;
      }
      
      tbody.innerHTML = laptops.map(l => `
        <tr>
          <td><img src="${l.image}" onerror="this.src='https://via.placeholder.com/70x52/f3f4f6/6b7280?text=L'"></td>
          <td><strong>${l.name}</strong></td>
          <td>${l.brand}</td>
          <td>${l.cpu}</td>
          <td>${l.ram}</td>
          <td>$${l.price.toLocaleString()}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon btn-edit" onclick="editLaptop(${l.id})" title="Edit">️</button>
              <button class="btn-icon btn-delete" onclick="deleteLaptop(${l.id})" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // ===== Add / Edit =====
    let editingId = null;

    function openAddForm() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Add New Laptop';
      document.getElementById('laptopForm').reset();
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('formModal').classList.add('active');
    }

    function editLaptop(id) {
      const laptop = loadLaptops().find(l => l.id === id);
      if (!laptop) return;
      
      editingId = id;
      document.getElementById('formTitle').textContent = 'Edit Laptop';
      
      const form = document.getElementById('laptopForm');
      Object.keys(laptop).forEach(key => {
        if (key === 'id') return;
        const input = form.querySelector(`[name="${key}"]`);
        if (input) input.value = laptop[key];
      });
      
      // Show image preview if it's a base64 image
      const imageUrl = laptop.image;
      if (imageUrl.startsWith('data:image')) {
        const preview = document.getElementById('imagePreview');
        preview.src = imageUrl;
        preview.style.display = 'block';
      }
      
      document.getElementById('formModal').classList.add('active');
    }

    function closeForm() {
      document.getElementById('formModal').classList.remove('active');
      editingId = null;
    }

    function saveLaptop(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.price = Number(data.price);
      
      const laptops = loadLaptops();
      
      if (editingId) {
        const idx = laptops.findIndex(l => l.id === editingId);
        laptops[idx] = { ...laptops[idx], ...data };
        showToast('Laptop updated successfully', 'success');
      } else {
        const newId = laptops.length > 0 ? Math.max(...laptops.map(l => l.id)) + 1 : 1;
        laptops.push({ id: newId, ...data });
        showToast('Laptop added successfully', 'success');
      }
      
      saveLaptops(laptops);
      closeForm();
      renderAdminTable();
    }

    function deleteLaptop(id) {
      if (!confirm('Are you sure you want to delete this laptop?')) return;
      
      let laptops = loadLaptops();
      laptops = laptops.filter(l => l.id !== id);
      saveLaptops(laptops);
      renderAdminTable();
      showToast('Laptop deleted', 'success');
    }

    // ===== Import / Export =====
    function exportData() {
      const laptops = loadLaptops();
      const blob = new Blob([JSON.stringify(laptops, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `laptops-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup file downloaded', 'success');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = event => {
        try {
          const data = JSON.parse(event.target.result);
          if (!Array.isArray(data)) throw new Error('Invalid format');
          saveLaptops(data);
          renderAdminTable();
          showToast(`${data.length} laptops imported successfully`, 'success');
        } catch (err) {
          showToast('Error reading file', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetData() {
      if (!confirm('Are you sure? All data will be reset to default.')) return;
      localStorage.removeItem('laptops_data');
      renderAdminTable();
      showToast('Data reset to default', 'success');
    }

    // ===== Toast =====
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Close modal on overlay click
    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });
  </script>
</body>
</html>
